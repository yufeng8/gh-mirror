# gh-mirror 通用 Docker 部署（与 install.sh MODE=docker 互补，纯 compose 编排，不依赖特定面板）
#
# 设计原则：网关核心（gh-mirror）与反向代理（nginx）解耦，由部署方按需选择，避免强行占用主机 80/443
# （部署机可能已运行自己的 nginx / KPanel 等）。两种用法见下：
#
#   A. 机器已有 nginx / KPanel 等反代（最常见）：
#        docker compose up -d
#      然后取消下方 gh-mirror 的 ports 注释，把网关暴露到本机（默认仅 127.0.0.1:8080），
#      由既有反代转发（转发写法参考 nginx/gh-mirror.compose.conf 的 location / 段）。
#
#   B. 用内置 nginx 提供 80/443（含 TLS 反代）：
#        docker compose --profile proxy up -d
#      如需 HTTPS，证书申请见 docs/docker-deploy.md。
#
# 默认从本仓库源码构建（build: .，使用根目录 Dockerfile）。
# 如需改用预构建镜像，注释掉 build 段并取消 image 行注释即可：
#   image: ghcr.io/yufeng8/gh-mirror:latest

services:
  gh-mirror:
    build: .
    # image: ghcr.io/yufeng8/gh-mirror:latest
    container_name: gh-mirror
    restart: unless-stopped
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:?请在 .env 中设置 ADMIN_PASS}
      ADMIN_PATH: ${ADMIN_PATH:-/admin}
      ADMIN_SECRET: ${ADMIN_SECRET:?请在 .env 中设置 ADMIN_SECRET（openssl rand -hex 32）}
      COOKIE_SECURE: "true"
      TOKENS_FILE: /var/lib/gh-mirror/tokens.json
      LISTEN: 0.0.0.0:8080
      CACHE_DIR: /var/cache/gh-mirror
      CACHE_TTL_MINUTES: ${CACHE_TTL_MINUTES:-1440}
      MAX_CACHE_MB: ${MAX_CACHE_MB:-200}
      UPSTREAM_TIMEOUT: ${UPSTREAM_TIMEOUT:-60}
    volumes:
      - gm-cache:/var/cache/gh-mirror
      - gm-data:/var/lib/gh-mirror
    # 场景 A：取消注释，把网关暴露到本机，交给既有 nginx/KPanel 反代到 127.0.0.1:8080
    # （仅监听本机回环更安全；如需容器外其他机访问可改为 "8080:8080"）
    # ports:
    #   - "127.0.0.1:8080:8080"
    expose:
      - "8080"
    networks:
      - gm-net

  # 场景 B：内置反向代理。用 `docker compose --profile proxy up -d` 启用；不启用则不占用主机 80/443。
  nginx:
    image: nginx:1.27-alpine
    container_name: gh-mirror-nginx
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      - gh-mirror
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/gh-mirror.compose.conf:/etc/nginx/conf.d/default.conf:ro
      # 注意：certbot 申请证书时需要可写，故此处不加 :ro
      - gm-certs:/etc/letsencrypt
      - gm-certs:/var/www/certbot
    networks:
      - gm-net

volumes:
  gm-cache:
  gm-data:
  gm-certs:

networks:
  gm-net:
    driver: bridge
