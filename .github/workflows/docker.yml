# GitHub Actions：自动构建多架构 Docker 镜像并推送到 GitHub Container Registry (GHCR)
#
# - 推送 main 分支：打上 latest 标签
# - 打 v* 标签（如 v1.0.0）：打上同名标签，install.sh 的 Docker 模式可直接 docker pull
#
# 镜像在推送后会被自动设为 Public（见末尾「Set package visibility to public」步骤），
# 以便匿名服务器 `docker pull ghcr.io/<owner>/<repo>:latest` 可用。
name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set package visibility to public
        # 用 Action 自带的 GITHUB_TOKEN（已授权 packages: write）把 GHCR 包设为 Public，
        # 使匿名 docker pull 可用。失败不阻断构建（continue-on-error）。
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${GITHUB_REPOSITORY%/*}"
          PKG="${GITHUB_REPOSITORY,,}"
          PKG="${PKG#*/}"
          echo "Setting GHCR package '${PKG}' visibility to public..."
          if gh api --method PATCH "users/${OWNER}/packages/container/${PKG}/visibility" \
               -f visibility=public; then
            echo "OK: package ghcr.io/${GITHUB_REPOSITORY} is now public"
          else
            echo "WARN: 通过 GITHUB_TOKEN 设置可见性失败（少数情况下需要带 write:packages 的 PAT，或到 Packages 设置里手动改为 Public）"
          fi
