name: ✨ 功能建议
about: 为 gh-mirror 提出新功能或改进建议
title: "[Feature] 简短描述"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议！请描述清楚场景和期望方案，方便维护者评估。

  - type: checkboxes
    id: checks
    attributes:
      label: 自检清单
      options:
        - label: 我已搜索现有 Issues，未找到相同或类似建议
          required: true
        - label: 这个功能对私有化部署 / 镜像加速场景有实际价值
          required: false

  - type: textarea
    id: problem
    attributes:
      label: 关联问题
      description: 这个功能解决了什么痛点？
      placeholder: 例如：目前无法限制单个 token 的流量配额，容易被某个用户用满带宽

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你希望的实现方式
      placeholder: 例如：后台增加 token 粒度的速率/流量限制，并支持按天/月统计
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 如果主方案不可行，是否有折中实现？

  - type: textarea
    id: context
    attributes:
      label: 其他上下文
      description: 补充截图、示例 URL、使用场景等
