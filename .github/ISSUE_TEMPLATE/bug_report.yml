name: 🐛 Bug 反馈
about: 报告 gh-mirror 运行中的问题
title: "[Bug] 简短描述"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请填写以下信息，帮助我们快速定位问题。

  - type: checkboxes
    id: checks
    attributes:
      label: 自检清单
      options:
        - label: 我已搜索现有 Issues，未找到相同或类似问题
          required: true
        - label: 我已阅读 README 与常见环境变量说明
          required: true
        - label: 我使用的是最新 Release 或 main 分支代码
          required: false

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简洁描述你遇到的问题
      placeholder: 例如：安装后访问 /admin 返回 502，或下载 Release 二进制时断点续传失败
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供能让维护者复现问题的具体操作步骤
      placeholder: |
        1. 执行 ...
        2. 访问 ...
        3. 出现 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 期望返回 200 并正常下载 / 后台正常登录 / ...

  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / 报错信息
      description: 包括完整的命令输出、HTTP 状态码、日志片段等
      placeholder: |
        502 Bad Gateway
        journalctl -u gh-mirror 输出：...

  - type: dropdown
    id: deploy_mode
    attributes:
      label: 部署方式
      options:
        - 原生 (native / systemd)
        - Docker
        - 手动部署
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / Commit
      placeholder: v1.0.0 或 commit hash

  - type: input
    id: env
    attributes:
      label: 操作系统 / 架构
      placeholder: Ubuntu 24.04 / amd64, Debian 12 / arm64 等

  - type: textarea
    id: logs
    attributes:
      label: 相关日志或截图
      description: 可贴出 systemd 日志、nginx 错误日志、浏览器开发者工具截图等
      render: shell
