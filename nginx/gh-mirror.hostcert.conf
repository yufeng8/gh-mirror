# gh-mirror HTTPS 反代（复用宿主机证书；配合 docker-compose.hostcert.yml 使用）
# 证书由宿主机既有 certbot 管理并续期，本文件只负责 443 服务 + 80→443 跳转，不申请证书。
# 用法：把下面两处 <DOMAIN> 替换为你的域名（如 git.yufeng.site）。

server {
    listen 80;
    server_name <DOMAIN>;
    # 关键：禁止合并双斜杠，否则 /https://... 会被改成 /https:/... 导致解析失败
    merge_slashes off;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name <DOMAIN>;
    merge_slashes off;
    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 0;

    location / {
        # $request_uri 保留原始请求（含双斜杠与查询串）
        proxy_pass http://gh-mirror:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
