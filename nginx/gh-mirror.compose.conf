# gh-mirror 反向代理（compose 专用，容器网络反代到 gh-mirror:8080）
# 与仓库既有的 nginx/gh-mirror.conf（宿主机 host 网络 + 127.0.0.1:8080）区分，互不干扰。
server {
    listen 80;
    server_name _;

    # 关键：禁止合并双斜杠，否则 /https://... 会被改成 /https:/... 导致解析失败
    merge_slashes off;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 0;

    # Let's Encrypt http-01 挑战目录（certbot webroot 写入共享卷 gm-certs 的 /var/www/certbot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # $request_uri 保留原始请求（含双斜杠与查询串）
        proxy_pass http://gh-mirror:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
