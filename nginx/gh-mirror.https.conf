# gh-mirror HTTPS 反代模板（供 compose 内置 nginx 使用，不默认启用）
#
# 用法：
#   1) 把下面两处 <DOMAIN> 替换为你的域名（如 git.yufeng.site）
#   2) 编辑 docker-compose.yml 中 nginx 的 volumes，将
#        ./nginx/gh-mirror.compose.conf:/etc/nginx/conf.d/default.conf:ro
#      改为
#        ./nginx/gh-mirror.https.conf:/etc/nginx/conf.d/default.conf:ro
#   3) 申请证书（gm-certs 卷对 nginx 可写，certbot 可直接写）：
#        docker compose --profile proxy run --rm --entrypoint "" nginx \
#          certbot certonly --webroot -w /var/www/certbot -d <DOMAIN>
#   4) 重新加载：docker compose --profile proxy up -d nginx

server {
    listen 80;
    server_name <DOMAIN>;
    # 关键：禁止合并双斜杠，否则 /https://... 会被改成 /https:/... 导致解析失败
    merge_slashes off;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name <DOMAIN>;
    merge_slashes off;
    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 0;

    location / {
        # $request_uri 保留原始请求（含双斜杠与查询串）
        proxy_pass http://gh-mirror:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
