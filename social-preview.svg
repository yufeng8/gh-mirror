<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05100b"/>
      <stop offset="0.5" stop-color="#0a2a1c"/>
      <stop offset="1" stop-color="#06222f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#16213a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.4"/>
  <ellipse cx="150" cy="200" rx="320" ry="260" fill="url(#glow)"/>

  <text x="72" y="138" font-size="15" letter-spacing="3" fill="#7dd3fc" font-weight="600">SELF-HOSTED MULTI-SERVICE ACCELERATION GATEWAY</text>

  <!-- logo + wordmark lockup -->
  <g transform="translate(70,158)">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#logoGrad)"/>
    <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
      <path d="M21 32 A11 11 0 0 1 43 32"/>
      <path d="M43 32 A11 11 0 0 1 21 32"/>
    </g>
    <path d="M43 32 L37 30 L41 36 Z" fill="#ffffff"/>
    <path d="M21 32 L27 34 L23 28 Z" fill="#ffffff"/>
  </g>
  <text x="146" y="210" font-size="64" font-weight="800" fill="url(#title)">gh-mirror</text>
  <rect x="72" y="240" width="200" height="5" rx="2.5" fill="url(#logoGrad)"/>

  <text x="70" y="300" font-size="24" fill="#d7f5e5">Docker Images · GitHub Assets · HuggingFace Weights</text>
  <text x="70" y="334" font-size="24" fill="#d7f5e5">One Gateway for All · Built-in MCP (AI Agent Ready)</text>
  <text x="70" y="364" font-size="18" fill="#86efac">Multi-tenant Isolation · Email / Invite Sign-up · Password Recovery</text>

  <!-- feature tags -->
  <g font-size="16" fill="#cbd5e1">
    <rect x="70" y="402" width="176" height="36" rx="18" fill="#111c33" stroke="#22304d"/><circle cx="92" cy="420" r="5" fill="#22d3ee"/><text x="108" y="426">MCP Ready</text>
    <rect x="258" y="402" width="176" height="36" rx="18" fill="#111c33" stroke="#22304d"/><circle cx="280" cy="420" r="5" fill="#34d399"/><text x="296" y="426">Docker Hub</text>
    <rect x="446" y="402" width="176" height="36" rx="18" fill="#111c33" stroke="#22304d"/><circle cx="468" cy="420" r="5" fill="#a78bfa"/><text x="484" y="426">GitHub</text>
    <rect x="70" y="446" width="176" height="36" rx="18" fill="#111c33" stroke="#22304d"/><circle cx="92" cy="464" r="5" fill="#fbbf24"/><text x="108" y="470">HuggingFace</text>
    <rect x="258" y="446" width="176" height="36" rx="18" fill="#111c33" stroke="#22304d"/><circle cx="280" cy="464" r="5" fill="#f472b6"/><text x="296" y="470">Token Auth</text>
    <rect x="446" y="446" width="176" height="36" rx="18" fill="#111c33" stroke="#22304d"/><circle cx="468" cy="464" r="5" fill="#38bdf8"/><text x="484" y="470">Offline tar</text>
  </g>

  <text x="70" y="510" font-size="15" fill="#94a3b8">Go standard library · Zero dependencies · Single binary · Offline buildable</text>

  <!-- right: service cards -->
  <g>
    <rect x="700" y="92" width="500" height="104" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="730" cy="145" r="11" fill="#2496ED"/>
    <text x="754" y="150" font-size="17" fill="#ffffff" fill-opacity="0.94">Docker Image Acceleration</text>
    <text x="1172" y="150" font-size="13" fill="#9fe8c4" text-anchor="end">/v2/&lt;user&gt;/…</text>
    <rect x="700" y="210" width="500" height="104" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="730" cy="263" r="11" fill="#e6edf3"/>
    <text x="754" y="268" font-size="17" fill="#ffffff" fill-opacity="0.94">GitHub Assets Acceleration</text>
    <text x="1172" y="268" font-size="13" fill="#9fe8c4" text-anchor="end">/g/&lt;user&gt;/&lt;token&gt;/…</text>
    <rect x="700" y="328" width="500" height="104" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="730" cy="381" r="11" fill="#FFD21E"/>
    <text x="754" y="386" font-size="17" fill="#ffffff" fill-opacity="0.94">HuggingFace Weights</text>
    <text x="1172" y="386" font-size="13" fill="#9fe8c4" text-anchor="end">/hf/&lt;user&gt;/&lt;token&gt;/…</text>
    <rect x="700" y="446" width="500" height="104" rx="14" fill="#6f42c1" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.4"/>
    <circle cx="730" cy="499" r="11" fill="#a78bfa"/>
    <text x="754" y="504" font-size="17" fill="#ffffff" fill-opacity="0.94">MCP Server (AI Agent Ready)</text>
    <text x="1172" y="504" font-size="13" fill="#c4b5fd" text-anchor="end">POST /ai/&lt;user&gt;/mcp</text>
  </g>
</svg>